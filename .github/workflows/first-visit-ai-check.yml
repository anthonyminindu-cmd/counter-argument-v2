name: First-visit Diff AI peace debate
on:
  push:
    branches: ['qa/diff-ai-first-visit-819b95c48']
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install --quiet playwright==1.55.0
      - name: Test a private debate on the public site
        env:
          DK_TEST_URL: https://www.differkindly.com
        run: python -u maintenance/e2e/solo_first_visit.py
