name: Live two-browser friend invitations
on:
  workflow_dispatch:
    inputs:
      first_visit:
        description: Test two new accounts through a private debate and both poster downloads
        type: boolean
        default: false
  push:
    branches:
      - qa/friend-candidate
      - qa/friend-live
permissions:
  contents: read
jobs:
  two-members:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.first_visit && 22 || 6 }}
    env:
      DK_TEST_PROJECT_REF: ${{ vars.DK_TEST_PROJECT_REF }}
      DK_TEST_PUBLISHABLE_KEY: ${{ vars.DK_TEST_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install playwright==1.55.0
      - name: Run real invitations in separate Chrome processes
        if: ${{ !inputs.first_visit }}
        run: python maintenance/e2e/isolated_target.py friend_live
      - name: Test first-time desktop and phone participants on Differ Kindly
        if: ${{ inputs.first_visit }}
        env:
          DK_TEST_RANKING: '1'
        run: python -u maintenance/e2e/isolated_target.py friend_first_visit
