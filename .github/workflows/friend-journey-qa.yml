name: Two-person debate journey
on:
  push:
    branches: [qa/friend-journey-clarity]
permissions:
  contents: read
jobs:
  friend-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install playwright==1.55.0
      - name: Exercise desktop and phone with two real accounts
        env:
          DK_TEST_URL: http://127.0.0.1:8172/counter-argument-v2
          DK_TEST_SERVE_CHECKOUT: "1"
          DK_TEST_SCREENSHOTS: logs
          DK_TEST_RANKING: "1"
        run: python maintenance/e2e/friend_live.py
