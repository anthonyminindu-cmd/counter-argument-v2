name: Check member header and notifications
on: [push]
jobs:
  signed-in-members:
    if: github.ref_name == 'qa/member-header'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install playwright==1.55.0
      - run: python maintenance/e2e/dashboard_live.py
