name: Verify profile support and impressions
on: [push]
jobs:
  signed-in-members:
    if: github.ref_name == 'qa/support-impressions'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install playwright==1.55.0
      - run: python maintenance/e2e/dashboard_live.py
        env:
          DK_QA_PUBLIC_POSTER: poster-0f7ba5510ebec28c5dd1d6ba811dfb8a5a2c74357aeefa417f7ff983bcc596e2
          DK_QA_PUBLIC_COMMENT: 93d0a0d2-bd57-41e9-9fba-c5cab88aac05
