name: Check signed-in profile dashboard
on: [push]
jobs:
  dashboard:
    if: github.ref_name == 'qa/profile-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install playwright==1.55.0
      - run: python maintenance/e2e/dashboard_live.py
