name: Verify Trending posters and all explanations
on:
  push:
    branches: [qa/home-section-preview]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install --quiet playwright==1.55.0
      - run: python maintenance/e2e/verify_trending_posters.py
