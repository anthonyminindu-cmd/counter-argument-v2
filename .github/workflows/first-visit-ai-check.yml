name: Verify released first-visit Diff AI debate
on:
  push:
    branches: ['qa/diff-ai-first-visit-819b95c48']
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '263892431fb15738916daf5b0f467a9f218b0a10'
      - name: Wait for the released entry page
        run: |
          for attempt in $(seq 1 55); do
            if curl --silent --show-error --fail 'https://www.differkindly.com/?release=263892431fb15738916daf5b0f467a9f218b0a10' | grep -Fq 'assets/index-v2-fb1be954f66a1914.js'; then exit 0; fi
            sleep 4
          done
          exit 1
      - run: python -m pip install --quiet playwright==1.55.0
      - name: Test a private debate on the public site
        env:
          DK_TEST_URL: https://www.differkindly.com
        run: python -u maintenance/e2e/solo_first_visit.py
