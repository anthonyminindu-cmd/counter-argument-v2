name: Verify published debate and comment recovery
on:
  push:
    branches: [qa/black-friday-reader-20261122]
permissions:
  contents: read
  actions: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@v4
        with:
          name: friend-debate-screenshots
          path: original
          github-token: ${{ github.token }}
          run-id: 45085417348
      - run: python -m pip install playwright==1.55.0 pillow
      - run: python maintenance/e2e/nov22_reader.py
        env:
          DK_TEST_URL: https://anthonyminindu-cmd.github.io/counter-argument-v2
          DK_TEST_SCREENSHOTS: current
      - name: Collect verified screenshots
        if: always()
        run: python maintenance/e2e/nov22_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-friend-journey
          path: Differ-Kindly-QA-screenshots.zip
          retention-days: 14
