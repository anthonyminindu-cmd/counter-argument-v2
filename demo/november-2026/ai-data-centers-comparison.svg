<g data-rank="19"><text x="84" y="787" font-size="20" fill="#43604c">19</text><text x="136" y="787" font-size="26" font-weight="bold">Build only in stages</text></g>
<rect x="812" y="181" rx="21" width="738" height="658" fill="#f4f0df"/><text x="846" y="239" font-size="32" font-weight="bold">Pause until costs are clear</text><path d="M846 257h670" stroke="#637468"/><g data-rank="2"><text x="846" y="292" font-size="20" fill="#43604c">2</text><text x="898" y="292" font-size="26" font-weight="bold">Protect household bills</text></g>
