name: Verify published first-time friend debate
on:
  push:
    branches: ['qa/first-visit-inbox-fe6b489760']
permissions:
  contents: read
jobs:
  first-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '819b95c48f8068b3383a0971821cff26529c3e01'
      - run: python -m pip install --quiet playwright==1.55.0
      - name: Verify public entry pages have the new build
        env:
          ASSET: 'assets/index-v2-7b06ba924988f71f.js'
          RELEASE: '819b95c48f8068b3383a0971821cff26529c3e01'
        run: |
          python -u - <<'PY'
          import os,time
          from urllib.request import Request,urlopen
          from urllib.error import URLError
          root="https://www.differkindly.com"
          for path in ("/","/debate/start/","/debate/active/"):
              for attempt in range(45):
                  try:
                      req=Request(root+path+"?release="+os.environ["RELEASE"],headers={"Cache-Control":"no-cache"})
                      with urlopen(req,timeout=10) as res:
                          if os.environ["ASSET"].split("/")[-1] in res.read().decode():
                              print("PASS published release at",path)
                              break
                  except URLError:
                      pass
                  time.sleep(4)
              else:
                  raise RuntimeError("Release not yet visible at "+path)
          PY
      - name: Complete a private debate from the public homepage
        env:
          DK_TEST_URL: https://www.differkindly.com
          DK_TEST_RANKING: '1'
        run: python -u maintenance/e2e/friend_first_visit.py
